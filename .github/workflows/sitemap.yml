# Sitemap smoke test - weekly health check on the sitemap edge function.
# Sitemaps are served on-demand via supabase/functions/sitemap (proxied by Cloudflare),
# so nothing is committed back to the repo. This workflow only verifies that every
# variant returns a non-empty XML payload with at least one <url> entry.
name: Sitemap Smoke Test

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check sitemap index
        run: |
          set -euo pipefail
          BODY=$(curl -sf --max-time 120 --retry 2 --retry-delay 5 \
            "https://ppkbhdiiqdusdeatgdft.supabase.co/functions/v1/sitemap?type=index")
          echo "$BODY" | grep -q '<sitemap>' || (echo "Index missing <sitemap> entries" && exit 1)
          echo "Index OK"

      - name: Check static sitemap
        run: |
          set -euo pipefail
          COUNT=$(curl -sf --max-time 120 --retry 2 --retry-delay 5 \
            "https://ppkbhdiiqdusdeatgdft.supabase.co/functions/v1/sitemap?type=static" \
            | grep -c '<url>')
          [ "$COUNT" -gt 0 ] || (echo "Static sitemap empty" && exit 1)
          echo "Static: $COUNT URLs"

      - name: Check content sitemap
        run: |
          set -euo pipefail
          COUNT=$(curl -sf --max-time 120 --retry 2 --retry-delay 5 \
            "https://ppkbhdiiqdusdeatgdft.supabase.co/functions/v1/sitemap?type=content" \
            | grep -c '<url>')
          [ "$COUNT" -gt 0 ] || (echo "Content sitemap empty" && exit 1)
          echo "Content: $COUNT URLs"

      - name: Check locations page 1
        run: |
          set -euo pipefail
          COUNT=$(curl -sf --max-time 120 --retry 2 --retry-delay 5 \
            "https://ppkbhdiiqdusdeatgdft.supabase.co/functions/v1/sitemap?type=locations&page=1" \
            | grep -c '<url>')
          [ "$COUNT" -gt 0 ] || (echo "Locations page 1 empty" && exit 1)
          echo "Locations p1: $COUNT URLs"

      - name: Check cities page 1
        run: |
          set -euo pipefail
          COUNT=$(curl -sf --max-time 120 --retry 2 --retry-delay 5 \
            "https://ppkbhdiiqdusdeatgdft.supabase.co/functions/v1/sitemap?type=cities&page=1" \
            | grep -c '<url>')
          [ "$COUNT" -gt 0 ] || (echo "Cities page 1 empty" && exit 1)
          echo "Cities p1: $COUNT URLs"

      - name: Check provinces sitemap
        run: |
          set -euo pipefail
          COUNT=$(curl -sf --max-time 120 --retry 2 --retry-delay 5 \
            "https://ppkbhdiiqdusdeatgdft.supabase.co/functions/v1/sitemap?type=provinces" \
            | grep -c '<url>')
          [ "$COUNT" -gt 0 ] || (echo "Provinces empty" && exit 1)
          echo "Provinces: $COUNT URLs"

      - name: Check llms-full
        run: |
          set -euo pipefail
          BYTES=$(curl -sf --max-time 180 --retry 2 --retry-delay 5 \
            "https://ppkbhdiiqdusdeatgdft.supabase.co/functions/v1/llms-full-txt" | wc -c)
          [ "$BYTES" -gt 1000 ] || (echo "llms-full.txt suspiciously small" && exit 1)
          echo "llms-full.txt: $BYTES bytes"
