name: Regenerate Sitemap

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual triggering from GitHub Actions UI

jobs:
  regenerate-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch and save sitemap
        run: |
          curl -s https://ppkbhdiiqdusdeatgdft.supabase.co/functions/v1/sitemap > public/sitemap.xml
          echo "Sitemap generated with $(grep -c '<url>' public/sitemap.xml) URLs"

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/sitemap.xml
          git diff --staged --quiet || git commit -m "chore: regenerate sitemap [skip ci]"
          git push
