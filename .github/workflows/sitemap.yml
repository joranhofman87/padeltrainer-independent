name: Regenerate Sitemap

on:
  schedule:
    # Run weekly on Monday at 6:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Allow manual triggering from GitHub Actions UI

jobs:
  regenerate-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create sitemaps directory
        run: mkdir -p public/sitemaps

      - name: Fetch sitemap index
        run: |
          curl -sf --max-time 120 --retry 2 --retry-delay 5 "https://ppkbhdiiqdusdeatgdft.supabase.co/functions/v1/sitemap?type=index" > public/sitemap.xml
          echo "Sitemap index generated"

      - name: Fetch static sitemap
        run: |
          curl -sf --max-time 120 --retry 2 --retry-delay 5 "https://ppkbhdiiqdusdeatgdft.supabase.co/functions/v1/sitemap?type=static" > public/sitemaps/sitemap-static.xml
          echo "Static: $(grep -c '<url>' public/sitemaps/sitemap-static.xml || true) URLs"

      - name: Fetch content sitemap
        run: |
          curl -sf --max-time 120 --retry 2 --retry-delay 5 "https://ppkbhdiiqdusdeatgdft.supabase.co/functions/v1/sitemap?type=content" > public/sitemaps/sitemap-content.xml
          echo "Content: $(grep -c '<url>' public/sitemaps/sitemap-content.xml || true) URLs"

      - name: Fetch location sitemaps
        run: |
          set -euo pipefail
          PAGES=$(grep -oP 'sitemap-locations-\K[0-9]+' public/sitemap.xml | sort -n | tail -1 || echo 0)
          echo "Location pages to fetch: $PAGES"
          for PAGE in $(seq 1 "$PAGES"); do
            FILE="public/sitemaps/sitemap-locations-${PAGE}.xml"
            curl -sf --max-time 120 --retry 2 --retry-delay 5 "https://ppkbhdiiqdusdeatgdft.supabase.co/functions/v1/sitemap?type=locations&page=${PAGE}" > "$FILE"
            echo "Locations page ${PAGE}: $(grep -c '<url>' "$FILE" || true) URLs"
          done

      - name: Fetch city sitemaps
        run: |
          set -euo pipefail
          PAGES=$(grep -oP 'sitemap-cities-\K[0-9]+' public/sitemap.xml | sort -n | tail -1 || echo 0)
          echo "City pages to fetch: $PAGES"
          for PAGE in $(seq 1 "$PAGES"); do
            FILE="public/sitemaps/sitemap-cities-${PAGE}.xml"
            curl -sf --max-time 120 --retry 2 --retry-delay 5 "https://ppkbhdiiqdusdeatgdft.supabase.co/functions/v1/sitemap?type=cities&page=${PAGE}" > "$FILE"
            echo "Cities page ${PAGE}: $(grep -c '<url>' "$FILE" || true) URLs"
          done

      - name: Fetch provinces sitemap
        run: |
          curl -sf --max-time 120 --retry 2 --retry-delay 5 "https://ppkbhdiiqdusdeatgdft.supabase.co/functions/v1/sitemap?type=provinces" > public/sitemaps/sitemap-provinces.xml
          echo "Provinces: $(grep -c '<url>' public/sitemaps/sitemap-provinces.xml || true) URLs"

      - name: Summary
        run: |
          TOTAL=$(find public/sitemaps -name '*.xml' -exec grep -c '<url>' {} + 2>/dev/null | awk -F: '{s+=$2} END {print s+0}')
          echo "Total URLs across all sitemaps: $TOTAL"

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/sitemap.xml public/sitemaps/
          git diff --staged --quiet || git commit -m "chore: regenerate sitemaps [skip ci]"
          git push
