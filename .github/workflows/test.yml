name: Run Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gated by eslint-suppressions.json: NEW violations of any rule fail.
      # The baseline is shrink-only — when a suppressed issue is fixed, run
      # `npm run lint:prune` and commit, or this step fails on stale suppressions.
      - name: Lint (ratcheted)
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # Data-integrity invariants (PGlite): RLS isolation, RPC contracts, and — critically —
      # that list RPCs never HIDE a record (e.g. the invoice paid/unpaid tabs are a complete
      # partition across every status). A regression that makes data disappear fails here.
      - name: Data-integrity rehearsals
        run: npm run db:rehearse:all

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check i18n parity (en + nl)
        run: bun scripts/check-i18n-parity.ts
