name: Run Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# One live run per PR: a newer commit on the same PR cancels the now-obsolete
# run. The group key is the PR NUMBER, not head_ref — branch names collide
# (two forks both named `feature`, or a branch literally named
# `refs/heads/main` shadowing the push group) and a collision here means one
# PR's required checks cancel another's. Pushes get github.run_id — unique per
# run — so post-merge validation runs on main/master never queue behind, never
# replace, and never cancel each other: with a shared group even
# cancel-in-progress:false lets a third push REPLACE the pending second one,
# leaving a merged commit with no completed validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gated by eslint-suppressions.json: NEW violations of any rule fail.
      # The baseline is shrink-only — when a suppressed issue is fixed, run
      # `npm run lint:prune` and commit, or this step fails on stale suppressions.
      - name: Lint (ratcheted)
        run: npm run lint

      # Fails if any public / self-authenticating edge function is not verify_jwt=false
      # in config.toml (would 401 on deploy — e.g. the Stripe webhook, public images).
      - name: Edge-function config drift guard
        run: npm run check:edge-config

      # Proves the guard's own detection + diff logic against fixtures (literal/alias/helper-only/
      # extensionless consumers, SQL senders, stale registrations, escapes, and the real baseline)
      # so a weakened regex/root-list/stale-check can't pass silently.
      - name: Legacy service-role-key guard self-test
        run: npm run check:legacy-key:selftest

      # Inventories BOTH legacy keys (disabled as a pair): the service_role class (source + SQL/Vault +
      # repo-escape) AND the anon class (MANAGED_ANON), plus a browser-surface elevation check (no sb_secret_/
      # service-role key in src/) and SQL lifecycle enforcement. Keeps the Path-B migration inventory
      # (docs/CRON_SERVICE_KEY_SETUP.md) from silently drifting — see scripts/check-legacy-service-role-consumers.mjs.
      - name: Legacy API-key consumer guard
        run: npm run check:legacy-key

      # Proves the pin classifier discriminates: every range form (@2, @2.57, ^2.57.2, latest,
      # no version) is rejected and every exact form accepted, on fixtures plus the real tree.
      # Most importantly it catches a brace-blind extractor, which would report a clean repo while
      # silently skipping every braced import.
      - name: Edge import-pin guard self-test
        run: npm run check:edge-pins:selftest

      # Fails if any external import in the edge-function bundle graph names a version RANGE.
      # A floating specifier makes deployability depend on what a CDN resolves that hour; it is
      # what broke 15 of 18 function deploys on 2026-08-06. Covers entrypoints AND _shared/,
      # because a shared module is bundled into every function that imports it.
      - name: Edge import-pin guard
        run: npm run check:edge-pins

  # The REAL type-check. Root `tsc` has files:[] and checks nothing; this runs
  # `tsc -p tsconfig.app.json` and — since that project is perma-red with known
  # pre-existing errors — ratchets on NEW errors only vs scripts/tsc-app.baseline.json
  # (shrink-only, like the eslint-suppressions gate). Plus a real `vite build`.
  # Catches the class of bug that slipped past lint+vitest+build (a value call to an
  # un-imported name → runtime ReferenceError); see scripts/check-tsc-baseline.mjs.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (ratcheted vs baseline)
        run: npm run typecheck:baseline

      - name: Production build
        run: npm run build

  # ── The former monolithic `test` job, split so the slow suites run in PARALLEL ──
  #
  # It ran unit → db → rehearsals → i18n back to back (~13½ min, the critical path
  # of every PR). The pieces share nothing — different pools, different databases,
  # different runtimes — so they now run as separate jobs, and the `test` job at
  # the bottom aggregates them into the single required check branch protection
  # already knows. Total compute goes up (each job pays checkout + npm ci ≈ 1 min);
  # wall-clock roughly halves. Locally nothing changes: `npm test` and
  # `npm run db:rehearse:all` still run everything unsharded.

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  # The db vitest project: 142 files, each booting its own database (WASM pglite or
  # a real embedded Postgres). fileParallelism stays OFF inside a runner — that
  # determinism safeguard is the whole point of the project split (vitest.config.ts)
  # and sharding must never reintroduce contention. Wall-clock relief comes from
  # ABOVE the runner instead: `--shard=i/c` gives each isolated machine a disjoint
  # contiguous slice of the hash-sorted file list. Vitest's sequencer makes the
  # slices an exact partition (sha1-of-path sort, floor-balanced ranges) and refuses
  # to run at all if count exceeds the file total, so nothing is skipped and nothing
  # runs twice. --shard changes WHICH files a runner executes, never HOW.
  #
  # The shard count is strategy.job-total, i.e. the length of the `shard` list —
  # one source of truth. Keep this matrix single-dimension: a second dimension
  # would multiply job-total and break index/count.
  db-tests:
    runs-on: ubuntu-latest
    strategy:
      # One shard failing must not cancel the other: the surviving shard's result
      # still tells you whether the failure is isolated, and the `test` gate below
      # fails either way.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: npm run test:db -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Data-integrity invariants (PGlite): RLS isolation, RPC contracts, and — critically —
  # that list RPCs never HIDE a record (e.g. the invoice paid/unpaid tabs are a complete
  # partition across every status). A regression that makes data disappear fails here.
  #
  # Sharded like db-tests, but the partition lives in the runner itself
  # (scripts/db/rehearsal-shards.mjs): round-robin over the sorted DISCOVERED
  # rehearse-* inventory, so every rehearsal runs exactly once across the shard
  # set. The runner fails closed on malformed/unknown shard arguments (exit 2)
  # instead of degrading to "run everything", and src/test/rehearsalSharding.test.ts
  # re-proves the exactly-once union against the real directory on every CI run.
  db-rehearsals:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Data-integrity rehearsals (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: npm run db:rehearse:all -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Executable form of the split gate's contract (scripts/ci/workflow-contract.mjs):
  # every prerequisite job really runs its suite once and unweakened, the shard
  # matrices stay single-dimension 1..N, the required check keeps the job id
  # `test` and needs everything, the npm aliases still point at the real suites
  # with no lifecycle hooks, and the db project still selects every database test
  # file exclusively. It runs in its OWN job — a contract enforced only inside a
  # job whose steps could be skipped is not enforced — and is itself a
  # prerequisite of `test`, so dropping it turns the required check red.
  workflow-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify the CI gate contract
        run: node scripts/ci/workflow-contract.mjs

  # check-i18n-parity.ts imports only node: builtins and runs under bun, so this
  # job needs no npm ci — checkout + bun and done.
  i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check i18n parity (en + nl)
        run: bun scripts/check-i18n-parity.ts

  # Aggregator gate. The job id MUST stay exactly `test`: branch protection
  # requires the status check named "test", and renaming it would leave merges
  # gated on a check that never reports again. `if: always()` + explicit result
  # inspection — not the default success() behavior — so a failed, cancelled or
  # skipped prerequisite turns this check RED instead of leaving it skipped
  # (which some tooling reads as neutral). It succeeds ONLY when every
  # prerequisite result is literally "success".
  test:
    runs-on: ubuntu-latest
    needs: [unit-tests, db-tests, db-rehearsals, i18n, workflow-contract]
    if: always()
    steps:
      # No external binaries (jq et al.): a REQUIRED gate must not be able to
      # fail open because a tool was missing or errored — every value below is
      # expanded by the Actions expression engine before the shell ever runs,
      # and the shell only compares words under `set -euo pipefail`.
      # The per-job RESULT_* envs make the gate self-verifying: a prerequisite
      # DROPPED from `needs:` vanishes from the needs context, so its
      # expression expands to the EMPTY string — which is not "success" and
      # fails the gate. (A substring scan over toJSON(needs) was rejected in
      # review: a surviving job's output could contain the missing job's name.)
      # The join() loop then covers any FUTURE prerequisite added to needs:
      # without a matching RESULT_* line — every listed result must be success.
      - name: Verify every test prerequisite succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          RESULT_UNIT_TESTS: ${{ needs.unit-tests.result }}
          RESULT_DB_TESTS: ${{ needs.db-tests.result }}
          RESULT_DB_REHEARSALS: ${{ needs.db-rehearsals.result }}
          RESULT_I18N: ${{ needs.i18n.result }}
          RESULT_WORKFLOW_CONTRACT: ${{ needs.workflow-contract.result }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          status=0
          for pair in "unit-tests=${RESULT_UNIT_TESTS}" "db-tests=${RESULT_DB_TESTS}" \
                      "db-rehearsals=${RESULT_DB_REHEARSALS}" "i18n=${RESULT_I18N}" \
                      "workflow-contract=${RESULT_WORKFLOW_CONTRACT}"; do
            job="${pair%%=*}"; result="${pair#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::prerequisite '$job' result is '${result:-<missing from needs>}'"
              status=1
            fi
          done
          results="${{ join(needs.*.result, ' ') }}"
          [ -n "$results" ]
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a test prerequisite finished with result '$r'"
              status=1
            fi
          done
          [ "$status" -eq 0 ] && echo "All test prerequisites succeeded."
          exit "$status"

  # Pure unit tests for the Deno edge functions (auth gates, Mollie payment-ready, guest-name
  # resolution). These previously ran in NO CI (pre-scale audit P0 #3). The function-dir
  # index.test.ts files are INTEGRATION tests — they fetch a *deployed* function and need
  # VITE_SUPABASE_* secrets, so they are intentionally NOT in this gate (run them against a
  # deployed env separately, like the seo-smoke workflow).
  edge-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --no-check: this job is Deno-only (no `npm ci`), so there is no node_modules/ and Deno's
      # type-check phase cannot resolve "@types/node" (referenced transitively by the supabase-js
      # type defs) — which made the whole job die BEFORE running a single test. The edge functions
      # run as plain JS at deploy time (types are stripped), so the value here is RUNNING the unit
      # tests (auth gates, pricing math, payment-ready); --no-check restores that. (Full type-checking
      # of the edge functions against npm types in Deno is a separate, harder effort.)
      - name: Edge-function unit tests (deno)
        run: deno test --no-check --allow-env --allow-net supabase/functions/_shared/

  # Type-checks the ~96 edge-function index.ts files with a REAL `deno check` (NOT --no-check),
  # ratcheted vs scripts/edge-deno.baseline.json (shrink-only, like the tsc + eslint gates). The
  # edge-tests job above is deno-only and runs --no-check, so a mistyped / un-imported name in an
  # edge fn — incl. money-critical mollie-webhook — used to ship as a runtime ReferenceError with a
  # green build (e.g. backfill-invoices references undefined supabaseUrl/supabaseServiceKey). This
  # job needs BOTH `npm ci` (the script imports typescript, and --node-modules-dir=manual resolves
  # any surviving `npm:` specifier against node_modules) AND Deno. Every edge specifier is now the
  # `https://esm.sh/…` URL form precisely BECAUSE `npm:` resolves against whatever package.json
  # installs — a pin that disagreed with it made 14 entrypoints unresolvable, and the gate counted
  # them as zero errors. It now fails CLOSED on any entrypoint deno could not finish checking.
  # NEW errors fail; the known perma-red set does not block. Regenerate: npm run check:edge-types:update.
  edge-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Proves the CHECKED contract two ways. Six deno SHIMS pin the branching: a killed run, an
      # unresolvable specifier, a missing binary and a format drift are hard failures, while a
      # genuinely completed type-error run is not. Then one case runs the REAL installed deno on a
      # file with a genuine type error and asserts its output still has the shape the contract keys
      # on — shims alone would agree with a stale marker, so THAT is the case a `v2.x` wording
      # change fails on, here, with an explanation, instead of as a mystery on someone's PR.
      - name: Edge type-gate contract self-test
        run: npm run check:edge-types:selftest
      - name: Edge-function type-check (ratcheted vs baseline)
        run: npm run check:edge-types
