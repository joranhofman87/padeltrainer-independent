name: Rollout tooling (10c-a3)

# Runs the executable proofs for the 10c-a3 rollout bundle. Path-filtered so it
# only fires when the tooling changes (it does on the tooling PR). The SQL
# artifacts + rehearsals apply the REAL migration chain, including the three
# PR #615 migrations read at a PINNED SHA (verify/chain.mjs PR615_SHA); this job
# fetches that branch so `git show <sha>:...` resolves.
on:
  push:
    paths:
      - 'scripts/rollout/notif-10ca3/**'
      - '.github/workflows/rollout-tooling.yml'
  pull_request:
    paths:
      - 'scripts/rollout/notif-10ca3/**'
      - '.github/workflows/rollout-tooling.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the pinned PR-615 SHA)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the pinned PR-615 migration source
        run: git fetch --no-tags origin feat/notif-10ca3-pr1-email-reliability

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify rollout SQL artifacts (mutation-pinned, real chain)
        run: node scripts/rollout/notif-10ca3/verify/verify-artifacts.mjs

      - name: Rehearsals A/B/C/D (measure / lock-abort / prefix-recovery / full)
        run: node scripts/rollout/notif-10ca3/verify/rehearsals.mjs

      - name: Identity allow-list self-test
        run: bash scripts/rollout/notif-10ca3/verify/identity-selftest.sh

      - name: Critical-guard mutation tests
        run: bash scripts/rollout/notif-10ca3/verify/guard-mutation-test.sh

      - name: Operator control-flow test (resume615, stubbed gh/supabase/psql)
        run: bash scripts/rollout/notif-10ca3/verify/operator-flow-test.sh

      - name: Exit-status integrity (failures must be non-zero)
        run: bash scripts/rollout/notif-10ca3/verify/exit-status-test.sh

      - name: Step-6 send verifier (fixtures + mutants)
        run: bash scripts/rollout/notif-10ca3/verify/step6-verifier-test.sh

      - name: Log-fetch/verifier integration (fresh-evidence contract)
        run: bash scripts/rollout/notif-10ca3/verify/logfetch-integration-test.sh

      - name: Dry-run diagnostics (CLI failure reason preserved + redacted)
        run: bash scripts/rollout/notif-10ca3/verify/dryrun-diagnostics-test.sh

      - name: Worktree pooler link (fresh link before any linked db push)
        run: bash scripts/rollout/notif-10ca3/verify/worktree-link-test.sh

      - name: Clone safety (fenced window + atomic exit; artifact-interpreting)
        run: bash scripts/rollout/notif-10ca3/verify/clone-safety-test.sh

      - name: Clone safety on a REAL Postgres (executes the SQL artifacts)
        run: node scripts/rollout/notif-10ca3/verify/clone-safety-pg.mjs

      - name: Shell syntax check
        run: |
          for f in run-rollout.sh lib/common.sh logfetch/fetch-edge-logs.sh \
                   logfetch/verify-step6-send.sh \
                   verify/identity-selftest.sh verify/guard-mutation-test.sh verify/operator-flow-test.sh \
                   verify/exit-status-test.sh verify/step6-verifier-test.sh \
                   verify/logfetch-integration-test.sh verify/dryrun-diagnostics-test.sh \
                   verify/worktree-link-test.sh verify/clone-safety-test.sh; do
            bash -n "scripts/rollout/notif-10ca3/$f"
          done
