name: Migrations and types

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'src/integrations/supabase/types.ts'
      - 'scripts/check-types-drift.ts'
      - '.github/workflows/migrations.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'src/integrations/supabase/types.ts'
      - 'scripts/check-types-drift.ts'
      - '.github/workflows/migrations.yml'
  workflow_dispatch:

jobs:
  db-reset:
    name: supabase db reset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned (not `latest`): resolving the latest release hits the GitHub
          # API every run and flakes (Gateway Time-out / rate limit). Bump
          # deliberately when needed.
          version: 2.107.0

      - name: Start Supabase local stack
        run: supabase start

      - name: Reset database from migrations
        run: supabase db reset --yes

      # The academy-deletion flow cannot be proven anywhere else. Its catalogue-drift guard pins a
      # fingerprint of the REAL schema, so a PGlite fixture would only ever refuse; and its lock plan
      # exists to make a concurrent writer WAIT, which needs two sessions PGlite cannot provide. This
      # step runs against the local stack started above — never a remote database.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Academy-deletion integration (two-session, local Postgres)
        run: node scripts/db/academy-deletion-integration.mjs

  types-drift:
    name: generated types drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: supabase/setup-cli@v1
        with:
          # Pinned (not `latest`): resolving the latest release hits the GitHub
          # API every run and flakes (Gateway Time-out / rate limit). Bump
          # deliberately when needed.
          version: 2.107.0

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase and check types drift
        # The script prefers the setup-cli `supabase` binary on PATH (no platform
        # auth needed for --local). The dummy SUPABASE_ACCESS_TOKEN is belt-and-
        # braces: the npm-distributed CLI (>= 2.106) wrongly gates `gen types
        # --local` behind platform auth; a token-shaped value clears the gate and
        # --local then only talks to the local stack. Assembled at runtime so
        # secret scanners don't flag a literal token-shaped string.
        run: |
          export SUPABASE_ACCESS_TOKEN="sbp_$(printf '0%.0s' $(seq 1 40))"
          supabase start
          npx tsx scripts/check-types-drift.ts

      - name: Upload generated types on drift
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: types-generated
          path: types.generated.ts
          if-no-files-found: ignore
