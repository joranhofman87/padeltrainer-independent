name: E2E Tests (Non-Auth)

on:
  schedule:
    - cron: '0 5 * * 0' # Sundays at 5:00 AM UTC
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run non-auth E2E tests
        run: npx playwright test e2e/navigation.spec.ts e2e/i18n.spec.ts e2e/error-handling.spec.ts e2e/accessibility.spec.ts e2e/rls-health.spec.ts e2e/invoice-health.spec.ts e2e/performance.spec.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Role / payment / booking UI smoke specs (non-destructive: render +
      # route-mocked + login-gate checks; no account or booking creation).
      # Previously authored but never run by CI.
      - name: Run role/payment/booking E2E tests
        run: npx playwright test e2e/roles.spec.ts e2e/payments.spec.ts e2e/booking.spec.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
