<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Analytics is loaded conditionally based on cookie consent in src/lib/analytics.ts -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <link rel="preconnect" href="https://ficwbdrzefmblkbkomzw.supabase.co" crossorigin />
    <link rel="preconnect" href="https://ru3aqhjn.apicdn.sanity.io" crossorigin />
    <link rel="dns-prefetch" href="https://script.getreditus.com" />
    <link rel="preconnect" href="https://padeltrainer.ai" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" /></noscript>
    <!-- All dynamic meta tags (title, description, OG, Twitter) are managed by react-helmet-async per page -->
    <!-- Reditus affiliate tracking is loaded deferred in main.tsx -->
    <style>
      /* Inline critical styles for instant FCP before React hydrates */
      :root { color-scheme: light dark; }
      #root-loader{display:flex;align-items:center;justify-content:center;height:100vh;background:#ffffff}
      @media (prefers-color-scheme: dark){#root-loader{background:#0a0a0a}}
      #root-loader svg{width:48px;height:48px;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
    <script>
      // Set <html lang> from URL prefix early so bots and screen readers see correct locale
      (function(){
        try {
          var seg = (location.pathname.split('/')[1] || '').toLowerCase();
          if (['en','nl','es','de','fr','it'].indexOf(seg) !== -1) {
            document.documentElement.lang = seg;
          }
        } catch(e){}
      })();
    </script>
  </head>
  <body>
    <div id="root"><div id="root-loader"><svg viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
