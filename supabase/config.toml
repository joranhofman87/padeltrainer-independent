# Public / self-authenticating functions. These MUST stay verify_jwt = false — they are
# called WITHOUT a Supabase JWT, so the platform default (verify_jwt = true) would make the
# gateway 401 them on a fresh deploy. Each authenticates by its own mechanism (Stripe
# signature, public image, rate-limited public read, public health). Guarded by
# scripts/check-edge-fn-config.mjs so this can't silently regress.
[functions.stripe-subscription-webhook]
verify_jwt = false

[functions.og-image]
verify_jwt = false

[functions.rating-og-image]
verify_jwt = false

[functions.get-public-rating]
verify_jwt = false

[functions.health-check]
verify_jwt = false

# Twilio WhatsApp status callbacks + inbound (STOP) messages. Twilio sends no Supabase JWT;
# the endpoint authenticates every request by X-Twilio-Signature and 403s anything unsigned.
[functions.twilio-whatsapp-webhook]
verify_jwt = false

# Cron-driven outbox drainer, same shape as notification-email-worker: the caller is pg_cron
# presenting the service-role key, which on this project is an `sb_secret_…` key and NOT a
# JWT — so verify_jwt = true would 401 it at the gateway. It self-authenticates via
# requireServiceRole.
[functions.notification-whatsapp-worker]
verify_jwt = false

# Self-authenticating: validates a user JWT (getUser) for owner sends and the
# service-role key (isServiceRoleRequest) for the daily sweep cron + its own resume
# chain. Must stay false so the service-role caller isn't 401'd at the gateway.
[functions.send-campaign-emails]
verify_jwt = false
